---
- name: Deb13 - установка утилит для deb сборок
  hosts: all
  #hosts: localhost
  #connection: local
  become: yes
  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Check /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf
      changed_when: false     # пометить задачу как не изменяющую состояние системы

    - name: DBUG /etc/resolv.conf
      debug:
        msg: "Содержимое /etc/resolv.conf:\n{{ resolv_conf.content | b64decode }}"

    - name: Update apt cache
      become: yes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: установка стандартных утилит
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - sudo
          - curl
          - wget
          - axel
          - aria2
          - rsync
          - iptables
          - netfilter-persistent
          - sngrep
          - tmux
          - nmap
          - bind9-dnsutils
          - traceroute
          - highlight
          - ccze
          - inxi
          - sysstat
          - strace
          - htop
          - btop
          - atop
          - ncdu
          - tree
          - jq
          - yq
          - dnsutils
          - gnupg2
          - rsyslog
          - smartmontools
          - nvme-cli
          - hdparm
          - sysbench
      ignore_errors: yes

    - name: установка утилит анализа
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - tcpdump      # анализ сетевого трафика
          - tshark       # Wireshark в CLI
          - iproute2     # современные сетевые утилиты (ip, ss и т.д.)
          - ethtool      # диагностика сетевых интерфейсов
          - iperf3       # тестирование пропускной способности
          - ngrep        # grep для сетевого трафика
          - stress-ng    # нагрузочное тестирование
          - perf-tools-unstable  # инструменты профилирования
          - valgrind     # отладка памяти
          - gdb          # отладчик
      ignore_errors: yes
      
    - name: установка утилит мониторинга и системного администрирования
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - lm-sensors   # мониторинг температуры
          - iotop        # мониторинг дисковых операций
          - iftop        # мониторинг сетевого трафика
          - nethogs      # мониторинг трафика по процессам
          - powertop     # мониторинг энергопотребления
          - glances      # расширенный мониторинг системы
          - dstat        # сбор статистики
          - procps       # дополнительные утилиты для работы с процессами
          - lsb-release  # информация о дистрибутиве
      ignore_errors: yes
      
    - name: установка утилит для работы с файлами и архивами
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - pv           # progress viewer (прогресс для pipe)
          - mc           # Midnight Commander
          - rar          # для распаковки .rar архивов
          - unrar        # альтернатива rar
          - p7zip-full   # поддержка всех форматов 7z
          - arj          # для старых архивов
          - lzma         # компрессия LZMA
          - zstd         # современный компрессор
          - pigz         # многопоточный gzip
      ignore_errors: yes

    - name: установка утилит для deb сборок
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - build-essential
          - devscripts
          - debhelper
          - dh-make
          - dh-sequence-systemd
          - fakeroot
          - lintian
          - pbuilder
          - quilt       # для управления патчами в debian/patches
          - dpkg-dev    # дополнительные инструменты для работы с пакетами
          - debian-archive-keyring  # ключи для репозиториев
          - debootstrap  # для создания chroot-окружений
          - cowbuilder   # альтернатива pbuilder
          - distro-info  # информация о дистрибутивах
          - equivs       # создание фиктивных пакетов
          - apt-utils    # дополнительные утилиты apt
      ignore_errors: yes

    - name: установка утилит для python сборок
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - python3-all
          - python3-setuptools
          - python3-pip
          - python3-wheel
          - dh-python
          - python3-dev
          - python3-venv
          - python3-virtualenv
          - python3-pytest
          - python3-tox
          - python3-coverage
          - python3-black  # форматирование кода
          - python3-flake8 # линтинг
          - python3-mypy   # проверка типов
          - python3-pipx   # изолированная установка Python-утилит
      ignore_errors: yes

    - name: установка утилит для сборки специфических пакетов
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - cmake          # для проектов на CMake
          - automake       # для autotools
          - autoconf       # для autotools
          - libtool        # для библиотек
          - checkinstall   # создание пакетов из make install
          - sbuild         # ещё один инструмент сборки
      ignore_errors: yes

    - name: установка утилит для node.js сборок
      apt:
        name: "{{ item }}"
        state: present
      loop: 
          - nodejs
          - npm
      ignore_errors: yes

    - name: Очистка кеша apt
      apt:
        autoclean: yes
        autoremove: yes


