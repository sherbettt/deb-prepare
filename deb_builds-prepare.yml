---
- name: Deb13 - установка утилит для deb сборок
  hosts: all
  become: yes
  
  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - always
        - apt-update

    - name: Check /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf
      changed_when: false
      tags:
        - debug
        - network

    - name: DBUG /etc/resolv.conf
      debug:
        msg: "Содержимое /etc/resolv.conf:\n{{ resolv_conf.content | b64decode }}"
      tags:
        - debug
        - network

    - name: установка стандартных утилит
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - sudo
        - curl
        - wget
        - axel
        - aria2
        - rsync
        - iptables
        - netfilter-persistent
        - sngrep
        - tmux
        - nmap
        - bind9-dnsutils
        - traceroute
        - highlight
        - ccze
        - inxi
        - sysstat
        - strace
        - htop
        - btop
        - atop
        - ncdu
        - tree
        - jq
        - yq
        - dnsutils
        - gnupg2
        - rsyslog
        - smartmontools
        - nvme-cli
        - hdparm
        - sysbench
      ignore_errors: yes
      tags:
        - standard
        - tools
        

    - name: установка утилит анализа
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - tcpdump
        - tshark
        - iproute2
        - ethtool
        - iperf3
        - ngrep
        - stress-ng
        - perf-tools-unstable
        - valgrind
        - gdb
      ignore_errors: yes
      tags:
        - analysis
        - debug-tools
        - dev
        

    - name: установка утилит мониторинга
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - lm-sensors
        - iotop
        - iftop
        - nethogs
        - powertop
        - glances
        - dstat
        - procps
        - lsb-release
      ignore_errors: yes
      tags:
        - monitoring
        - sysadmin
        

    - name: установка утилит для работы с файлами
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - pv
        - mc
        - rar
        - unrar
        - p7zip-full
        - arj
        - lzma
        - zstd
        - pigz
      ignore_errors: yes
      tags:
        - files
        - archives
        

    - name: установка утилит для deb сборок
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - build-essential
        - devscripts
        - debhelper
        - dh-make
        - dh-sequence-systemd
        - fakeroot
        - lintian
        - pbuilder
        - quilt
        - dpkg-dev
        - debian-archive-keyring
        - debootstrap
        - cowbuilder
        - distro-info
        - equivs
        - apt-utils
      ignore_errors: yes
      tags:
        - deb-build
        - packaging
        - dev
        

    - name: установка утилит для python сборок
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - python3-all
        - python3-setuptools
        - python3-pip
        - python3-wheel
        - dh-python
        - python3-dev
        - python3-venv
        - python3-virtualenv
        - python3-pytest
        - python3-tox
        - python3-coverage
        - python3-black
        - python3-flake8
        - python3-mypy
        - python3-pipx
      ignore_errors: yes
      tags:
        - python
        - python-dev
        - dev
        

    - name: установка утилит для сборки специфических пакетов
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - cmake
        - automake
        - autoconf
        - libtool
        - checkinstall
        - sbuild
      ignore_errors: yes
      tags:
        - build-tools
        - compilation
        - dev
        

    - name: установка утилит для node.js сборок
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - nodejs
        - npm
      ignore_errors: yes
      tags:
        - nodejs
        - javascript
        - dev
        

    - name: Очистка кеша apt
      apt:
        autoclean: yes
        autoremove: yes
      tags:
        - cleanup
        - apt-clean

